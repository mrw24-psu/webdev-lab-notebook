<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 02 - Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-light">
    <main class="d-flex align-items-center">
      <form
        action="/submit"
        class="ira-form container border border-2 bg-white rounded my-5"
      >
        <div class="row col-12 my-3">
          <h1 class="text-center fs-2">Roth IRA Calculator</h1>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="balance"
            >Balance ($)</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="text"
              id="balance"
              name="balance"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="annual_contrib"
            >Annual contribution ($)</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="text"
              id="annual_contrib"
              name="annual_contrib"
            />
          </div>
        </div>

        <fieldset class="row mb-3">
          <legend class="col-sm-6 col-form-label">
            Maximize contributions?
          </legend>
          <div class="col-sm-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="max_yes"
                name="max_contrib"
                value="yes"
              />
              <label class="form-check-label" for="max_yes">Yes</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                id="max_no"
                name="max_contrib"
                value="no"
              />
              <label class="form-check-label" for="max_no">No</label>
            </div>
          </div>
        </fieldset>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="expected_return"
            >Expected rate of return (%)</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="number"
              id="expected_return"
              name="expected_return"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="current_age"
            >Current age</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="number"
              id="current_age"
              name="current_age"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="retire_age"
            >Retirement age</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="number"
              id="retire_age"
              name="retire_age"
            />
          </div>
        </div>

        <div class="row mb-3">
          <label class="col-sm-6 col-form-label" for="tax_rate"
            >Marginal tax rate (%)</label
          >
          <div class="col-sm-6">
            <input
              class="form-control"
              type="number"
              id="tax_rate"
              name="tax_rate"
            />
          </div>
        </div>

        <div class="row my-4">
          <div class="d-flex gap-2">
            <input
              class="btn btn-primary w-100"
              type="submit"
              value="Calculate"
            />
            <input
              class="btn btn-outline-dark w-100"
              type="reset"
              id="reset"
              value="Reset"
            />
          </div>
        </div>
        <p class="form-note">
          This exercise is a simplified version of the Roth IRA calculator at
          <a
            class="text-primary"
            href="https://www.calculator.net/roth-ira-calculator.html"
            >Calculator.net</a
          >
        </p>
      </form>
    </main>
  </body>
</html>
